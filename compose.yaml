# Local single-node stack: PostgreSQL 17, one-shot migrations, guest API and SPA server.
# The database password is never committed: copy .env.example to .env first.
#   cp .env.example .env && edit POSTGRES_PASSWORD and PIN_PEPPER
#   docker compose up -d --build --wait
# See docs/ops/containers.md for build, smoke test and current boundaries.
name: tojima

services:
  postgres:
    image: postgres:17
    environment:
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-tojima}
      POSTGRES_USER: ${POSTGRES_USER:-tojima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      # DML-only login role for the server; initdb creates it on a fresh volume.
      APP_DB_USER: ${APP_DB_USER:-tojima_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Applies migrations/postgres in order through the same Go runner the test
  # scripts use, then exits. The server starts only after it succeeds.
  migrate:
    build:
      context: .
    # The image's ENTRYPOINT is /server; run the migrate binary instead.
    entrypoint: ["/migrate"]
    # Discrete libpq variables instead of a URL so any password character
    # works without percent-encoding. pgx reads these when DATABASE_URL is unset.
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-tojima}
      PGUSER: ${POSTGRES_USER:-tojima}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      PGSSLMODE: disable
      # Grants DML-only access to this role after Up; unset keeps old behaviour.
      APP_DB_ROLE: ${APP_DB_USER:-tojima_app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
    environment:
      APP_ADDR: 0.0.0.0:8080
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-tojima}
      # The server (and staffadmin, which reuses this service) runs as the
      # DML-only runtime role; only migrate keeps the owner credentials.
      PGUSER: ${APP_DB_USER:-tojima_app}
      PGPASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env (see .env.example)}
      PGSSLMODE: disable
      APP_WEB_DIST: /app/web/dist
      # Explicit guest policy. Values in .env.example are local examples only.
      SESSION_TTL: ${SESSION_TTL:?set SESSION_TTL}
      GRANT_TTL: ${GRANT_TTL:?set GRANT_TTL}
      GRANT_WINDOW: ${GRANT_WINDOW:?set GRANT_WINDOW}
      GRANT_WINDOW_MAX: ${GRANT_WINDOW_MAX:?set GRANT_WINDOW_MAX}
      PIN_TTL: ${PIN_TTL:?set PIN_TTL}
      PIN_LOCKOUT: ${PIN_LOCKOUT:?set PIN_LOCKOUT}
      PIN_MAX_ATTEMPTS: ${PIN_MAX_ATTEMPTS:?set PIN_MAX_ATTEMPTS}
      PIN_LENGTH: ${PIN_LENGTH:?set PIN_LENGTH}
      PIN_PEPPER: ${PIN_PEPPER:?set PIN_PEPPER to a base64 secret of at least 32 bytes}
      PAYMENT_CREATE_RETRY_WINDOW: ${PAYMENT_CREATE_RETRY_WINDOW:?set PAYMENT_CREATE_RETRY_WINDOW}
      PAYMENT_CONTINUATION_TTL: ${PAYMENT_CONTINUATION_TTL:?set PAYMENT_CONTINUATION_TTL}
      PAYMENT_WORK_LEASE_TTL: ${PAYMENT_WORK_LEASE_TTL:?set PAYMENT_WORK_LEASE_TTL}
      # No Stripe mode, key, merchant mapping or proof key is enabled by default.
      STRIPE_MODE: ${STRIPE_MODE:-disabled}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_ACCOUNT_ID: ${STRIPE_ACCOUNT_ID:-}
      STRIPE_CREDENTIAL_REF: ${STRIPE_CREDENTIAL_REF:-}
      STRIPE_API_VERSION: ${STRIPE_API_VERSION:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
      STRIPE_MAX_AMOUNT_JPY: ${STRIPE_MAX_AMOUNT_JPY:-}
      STAFF_AUTH_MODE: ${STAFF_AUTH_MODE:-disabled}
      STAFF_OIDC_ISSUER: ${STAFF_OIDC_ISSUER:-}
      STAFF_OIDC_CLIENT_ID: ${STAFF_OIDC_CLIENT_ID:-}
      STAFF_OIDC_CLIENT_SECRET: ${STAFF_OIDC_CLIENT_SECRET:-}
      STAFF_OIDC_DISCOVERY_URL: ${STAFF_OIDC_DISCOVERY_URL:-}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-}
      CHECKOUT_PROOF_TTL: ${CHECKOUT_PROOF_TTL:-}
      CHECKOUT_SIGNING_KEYS: ${CHECKOUT_SIGNING_KEYS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Loopback by default; set APP_BIND=0.0.0.0 to publish beyond the host.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      # The image is distroless, so the server binary probes itself.
      test: ["CMD", "/server", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  keycloak:
    profiles: [staff]
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    # Validate at container startup, not Compose interpolation: inactive profiles
    # are still interpolated, and the default stack must need no staff secrets.
    entrypoint:
      - /bin/bash
      - -ec
      - |
        : "$${KC_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}"
        : "$${KC_HOSTNAME:?set KEYCLOAK_PUBLIC_URL in .env}"
        : "$${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME in .env}"
        : "$${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}"
        : "$${TOJIMA_STAFF_CLIENT_SECRET:?set TOJIMA_STAFF_CLIENT_SECRET in .env}"
        : "$${APP_PUBLIC_ORIGIN:?set APP_PUBLIC_ORIGIN in .env}"
        : "$${KEYCLOAK_BACKCHANNEL_LOGOUT_URL:?set KEYCLOAK_BACKCHANNEL_LOGOUT_URL in .env}"
        exec /opt/keycloak/bin/kc.sh "$$@"
      - --
    command: [start, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
      TOJIMA_STAFF_CLIENT_SECRET: ${TOJIMA_STAFF_CLIENT_SECRET:-}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-}
      KEYCLOAK_BACKCHANNEL_LOGOUT_URL: ${KEYCLOAK_BACKCHANNEL_LOGOUT_URL:-http://server:8080/staff/auth/backchannel-logout}
    volumes:
      - ./deploy/keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      # Keycloak has bash but no curl; query the private management listener.
      test: [CMD, /bin/bash, -ec, "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
