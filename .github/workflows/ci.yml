name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tojima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d tojima_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/tojima_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Go formatting
        run: make fmt-check
      - name: Test with race detector
        run: |
          test -n "$TEST_DATABASE_URL"
          go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Migration smoke (test-only SQLite)
        run: python3 scripts/migration-smoke.py
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json
          run_install: false
      - name: Install pinned guest web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Check and build guest web
        run: |
          pnpm --dir web check
          pnpm --dir web build
